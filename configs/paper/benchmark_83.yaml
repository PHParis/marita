database_dir: data/relational
output: results/paper_table2
logs: logs/paper_table2
databases: all
algorithms: [POPPER, AMIE3, SPIDER, MAHILDA]
expected_databases: 83

limits:
  timeout_seconds: 3600
  memory_gb: 10
  java_heap_gb: 8

hosts:
  - tipi00
  - tipi01
  - tipi02
  - tipi04

workers:
  POPPER: 1
  AMIE3: 1
  SPIDER: 2
  MAHILDA: 2

b2:
  databases: [Biodegradability]
  timeout_seconds: 600

b3:
  databases: all

pipeline:
  queue_dir: results/paper_pipeline
  coordinator_host: tipi00
  heartbeat_seconds: 30
  stale_after_seconds: 4200
  schedule: largest_first
  stages:
    - id: 010_setup
      experiment: setup
      workers_per_host: 1

    - id: 020_b2_disjointness
      experiment: B2
      databases: [Biodegradability]
      workers_per_host: 2
      timeout_seconds: 600
      memory_gb: 10

    - id: 030_b1_mahilda
      experiment: B1
      algorithms: [MAHILDA]
      databases: all
      workers_per_host: 2
      timeout_seconds: 3600
      memory_gb: 10

    - id: 040_b1_spider
      experiment: B1
      algorithms: [SPIDER]
      databases: all
      workers_per_host: 2
      timeout_seconds: 3600
      memory_gb: 10
      java_heap_gb: 8

    - id: 050_b3_joinability
      experiment: B3
      databases: all
      workers_per_host: 2
      timeout_seconds: 3600
      memory_gb: 10

    - id: 060_b1_amie3
      experiment: B1
      algorithms: [AMIE3]
      databases: all
      workers_per_host: 1
      timeout_seconds: 3600
      memory_gb: 10
      java_heap_gb: 8

    - id: 070_b1_popper
      experiment: B1
      algorithms: [POPPER]
      databases: all
      workers_per_host: 1
      timeout_seconds: 3600
      memory_gb: 10
