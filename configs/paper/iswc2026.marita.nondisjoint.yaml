monitor:
  memory_threshold: 16106127360  # 15 GB
  timeout: 7200  # 2 hours

database:
  path: ../../data/relational
  name: Biodegradability.db

logging:
  log_dir: ../../logs/ablation_nondisjoint

results:
  output_dir: ../../results/ablation_nondisjoint

algorithm:
  name: MARITA
  parameters:
    walk_length: 3
    max_tables: 3
    max_variables: 3
    disjoint_semantics: false
    support_threshold: 1
    timeout: 600

batch:
  workers: 1
  timeout: 7200

mlflow:
  use: false
  tracking_uri: file:../../mlruns
  experiment_name: Ablation Non-Disjoint
