monitor:
  memory_threshold: 16106127360  # 15GB in bytes
  timeout: 3600  # 1 hour

database:
  path: ../test_data  # Path to directory containing .db files
  name: test.db  # Generated by `uv run marita test-db`

logging:
  log_dir: ../logs  # Directory for logs

results:
  output_dir: ../results  # Directory for saving results

algorithm:
  name: "MARITA"  # Default algorithm

mlflow:
  use: false  # Enable only when local MLflow storage is configured
  tracking_uri: "file:../mlruns"  # File-based backend (relative to this config)
  experiment_name: "Rule Discovery"
