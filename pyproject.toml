[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mahilda"
version = "0.1.0"
description = "Rule discovery toolkit with MAHILDA, AMIE3, SPIDER, and ILP backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MAHILDA contributors" }]
dependencies = [
  "setuptools>=69",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "psutil>=5.9",
  "tqdm>=4.66",
  "colorama>=0.4.6",
  "mlflow>=2.11",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "clingo>=5.7",
  "pyswip>=0.2.10",
]

[project.scripts]
mahilda = "mahilda.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["mahilda*"]

[tool.setuptools.package-data]
"mahilda.algorithms" = ["bins/**/*.jar"]
"mahilda.database" = ["*.sh"]
"mahilda._vendor.popper" = ["lp/*.pl"]

[dependency-groups]
dev = [
  "coverage>=7.6.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pyright>=1.1.389",
  "ruff>=0.8.0",
  "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config --cov=mahilda --cov-report=term-missing --cov-report=xml --cov-report=html"

[tool.coverage.run]
branch = true
source = ["mahilda"]
omit = [
  "src/mahilda/algorithms/bins/*",
  "src/mahilda/_vendor/popper/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
extend-exclude = [
  "legacy",
  "research/legacy",
  "src/mahilda/_vendor",
  "src/mahilda/algorithms",
  "src/mahilda/database",
  "src/mahilda/utils/log_setup.py",
  "src/mahilda/utils/logging_utils.py",
  "src/mahilda/utils/monitor.py",
  "src/mahilda/utils/rules.py",
  "src/mahilda/utils/run_cmd.py",
  "src/mahilda/utils/structure_analysis.py",
]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "W",     # pycodestyle warnings
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "TCH",   # flake8-type-checking
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "SIM108", # allow ternary instead of if-else-expr
]

[tool.ruff.lint.isort]
known-first-party = ["mahilda"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "basic"
include = [
  "src/mahilda/cli",
  "src/mahilda/utils/config_loader.py",
]
exclude = [
  "**/_vendor/popper/**",
  "**/__pycache__",
]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
