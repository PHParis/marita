[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mahilda"
version = "0.1.0"
description = "Rule discovery toolkit with MAHILDA, AMIE3, SPIDER, and ILP backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MAHILDA contributors" }]
dependencies = [
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "psutil>=5.9",
  "tqdm>=4.66",
  "colorama>=0.4.6",
  "mlflow>=2.11",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "clingo>=5.7",
  "pyswip>=0.2.10",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["algorithms*", "database*", "utils*"]

[tool.setuptools.package-data]
algorithms = ["bins/**/*.jar", "bins/**/*.pl", "bins/**/*.py"]
database = ["*.sh"]

[dependency-groups]
dev = []
