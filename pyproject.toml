[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marita"
version = "0.1.0"
description = "MARITA rule discovery toolkit with optional benchmark baselines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MARITA contributors" }]
dependencies = [
  "setuptools>=69",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "rdflib>=7.0",
  "psutil>=5.9",
  "tqdm>=4.66",
  "colorama>=0.4.6",
  "mlflow>=2.11",
]

[project.optional-dependencies]
benchmark = []
datasets = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.scripts]
marita = "marita.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["marita*"]

[tool.setuptools.package-data]
"marita.evaluation" = ["third_party/**/*.jar"]
"marita.evaluation.datasets" = ["*.sh"]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.389",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "beautifulsoup4>=4.12",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config --cov=marita --cov-report=term-missing --cov-report=xml --cov-report=html"
markers = [
  "integration: marks slow external dependency integration tests",
  "java_required: marks tests that require Java runtime",
  "prolog_required: marks tests that require external Popper/SWI-Prolog tooling",
]

[tool.coverage.run]
branch = true
source = ["marita"]
omit = [
  "src/marita/evaluation/third_party/amie3/*",
  "src/marita/evaluation/third_party/metanome/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
extend-exclude = [
  "legacy",
  "research/legacy",
  "src/marita/algorithms/marita_core",
  "src/marita/evaluation/third_party",
  "src/marita/utils/log_setup.py",
  "src/marita/utils/monitor.py",
]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "W",     # pycodestyle warnings
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "TCH",   # flake8-type-checking
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "SIM108", # allow ternary instead of if-else-expr
]

[tool.ruff.lint.isort]
known-first-party = ["marita"]

[tool.ruff.lint.per-file-ignores]
"src/marita/algorithms/__init__.py" = ["F401"]
"src/marita/algorithms/base_algorithm.py" = ["I001"]
"src/marita/algorithms/marita.py" = ["UP", "TC001", "TC006", "SIM102"]
"src/marita/utils/rules.py" = ["I001", "UP", "SIM102"]
"src/marita/utils/run_cmd.py" = ["TC003"]
"tests/test_baselines_integration.py" = ["TC003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "basic"
include = [
  "src/marita",
]
exclude = [
  "legacy",
  "research",
  "**/evaluation/third_party/**",
  "**/__pycache__",
]
ignore = [
  "src/marita/algorithms/marita_core",
  "src/marita/evaluation/baselines/spider.py",
  "src/marita/evaluation/baselines/amie3.py",
  "src/marita/utils/rules.py",
  "src/marita/utils/rule_io.py",
  "src/marita/utils/tgd_factory.py",
]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
