[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mahilda"
version = "0.1.0"
description = "MAHILDA rule discovery toolkit with optional benchmark baselines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MAHILDA contributors" }]
dependencies = [
  "setuptools>=69",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "rdflib>=7.0",
  "psutil>=5.9",
  "tqdm>=4.66",
  "colorama>=0.4.6",
  "mlflow>=2.11",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
benchmark = [
  "clingo>=5.7",
  "pyswip>=0.2.10",
]

[project.scripts]
mahilda = "mahilda.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["mahilda*"]

[tool.setuptools.package-data]
"mahilda.evaluation" = ["third_party/**/*.jar", "third_party/popper/lp/*.pl"]
"mahilda.database" = ["*.sh"]

[dependency-groups]
dev = [
  "coverage>=7.6.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pyright>=1.1.389",
  "ruff>=0.8.0",
  "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config --cov=mahilda --cov-report=term-missing --cov-report=xml --cov-report=html"
markers = [
  "integration: marks slow external dependency integration tests",
  "java_required: marks tests that require Java runtime",
  "prolog_required: marks tests that require clingo and SWI-Prolog",
]

[tool.coverage.run]
branch = true
source = ["mahilda"]
omit = [
  "src/mahilda/evaluation/third_party/amie3/*",
  "src/mahilda/evaluation/third_party/metanome/*",
  "src/mahilda/evaluation/third_party/popper/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
extend-exclude = [
  "legacy",
  "research/legacy",
  "src/mahilda/_vendor",
  "src/mahilda/algorithms/mahilda_core",
  "src/mahilda/evaluation/third_party",
  "src/mahilda/evaluation/baselines/popper.py",
  "src/mahilda/utils/log_setup.py",
  "src/mahilda/utils/monitor.py",
]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "W",     # pycodestyle warnings
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "TCH",   # flake8-type-checking
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "SIM108", # allow ternary instead of if-else-expr
]

[tool.ruff.lint.isort]
known-first-party = ["mahilda"]

[tool.ruff.lint.per-file-ignores]
"src/mahilda/algorithms/__init__.py" = ["F401"]
"src/mahilda/algorithms/base_algorithm.py" = ["I001"]
"src/mahilda/algorithms/rule_discovery_algorithm.py" = ["I001"]
"src/mahilda/algorithms/mahilda.py" = ["UP", "TC006", "SIM102"]
"src/mahilda/utils/rules.py" = ["I001", "UP", "SIM102"]
"src/mahilda/utils/run_cmd.py" = ["TC003"]
"tests/test_baselines_integration.py" = ["TC003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "basic"
include = [
  "src/mahilda",
]
exclude = [
  "legacy",
  "research",
  "**/_vendor/**",
  "**/evaluation/third_party/**",
  "**/evaluation/third_party/popper/**",
  "**/__pycache__",
]
ignore = [
  "src/mahilda/algorithms/mahilda_core",
  "src/mahilda/evaluation/baselines/popper.py",
  "src/mahilda/evaluation/baselines/spider.py",
  "src/mahilda/evaluation/baselines/amie3.py",
  "src/mahilda/utils/rules.py",
]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
