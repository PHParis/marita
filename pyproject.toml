[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mahilda"
version = "0.1.0"
description = "Rule discovery toolkit with MAHILDA, AMIE3, SPIDER, and ILP backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "MAHILDA contributors" }]
dependencies = [
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "psutil>=5.9",
  "tqdm>=4.66",
  "colorama>=0.4.6",
  "mlflow>=2.11",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "clingo>=5.7",
  "pyswip>=0.2.10",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["algorithms*", "database*", "utils*"]

[tool.setuptools.package-data]
algorithms = ["bins/**/*.jar", "bins/**/*.pl", "bins/**/*.py"]
database = ["*.sh"]

[dependency-groups]
dev = [
  "pyright>=1.1.389",
  "ruff>=0.8.0",
  "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "W",     # pycodestyle warnings
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "TCH",   # flake8-type-checking
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "SIM108", # allow ternary instead of if-else-expr
]

[tool.ruff.lint.isort]
known-first-party = ["algorithms", "database", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]
exclude = [
  "**/bins/popper/**",
  "**/__pycache__",
]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false
